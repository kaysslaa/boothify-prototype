<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Boothify – Foto &amp; Sewa Event</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1b1740;--mut:#645f86;--pri:#5a3ff0;--pk:#ff5c8a;--pri2:#ebe7ff;--line:#e0dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131029;--card:#1e1a3f;--ink:#f2f0ff;--mut:#b0acd2;--pri:#9b87ff;--pri2:#2b2563;--line:#342e68}}
:root[data-theme="dark"]{--bg:#131029;--card:#1e1a3f;--ink:#f2f0ff;--mut:#b0acd2;--pri:#9b87ff;--pri2:#2b2563;--line:#342e68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;letter-spacing:-.02em}
.w{max-width:1060px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px;color:var(--pri)}
.nav nav{display:flex;gap:4px;overflow-x:auto;flex:1;justify-content:flex-end}
.nav nav a{padding:7px 14px;border-radius:99px;font-weight:700;color:var(--mut);white-space:nowrap}.nav nav a.on{background:var(--pri);color:#fff}
.btn{display:inline-block;border:0;background:var(--pri);color:#fff;padding:11px 20px;border-radius:99px;font:700 14px 'DM Sans',system-ui,sans-serif;cursor:pointer;text-align:center}
.btn.o{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.pk{background:var(--pk)}.btn.wh{background:#fff;color:#2a1c8f}
.btn.b{display:block;width:100%}.btn:disabled{opacity:.5}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{display:grid;gap:18px;grid-template-columns:1fr 1fr}
.chip{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--pri2);color:var(--pri);font:700 13px 'DM Sans',system-ui,sans-serif;border:0;cursor:pointer}.chip.on{background:var(--pri);color:#fff}.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
h1{font-size:clamp(34px,6.5vw,56px);line-height:1.05;font-weight:800}h2{font-size:26px;font-weight:800;margin:30px 0 12px}h3{font-size:17px;margin-bottom:8px}
.m{color:var(--mut)}.top{text-align:center;padding:38px 0 26px}.top p{max-width:480px;margin:12px auto 0}
.sv{border-radius:28px;padding:26px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.sv.a{background:linear-gradient(150deg,#ff7a9e,#ff4f7e)}.sv.b{background:linear-gradient(150deg,#7a5cff,#4a2fd8)}
.sv h2{margin:0;color:#fff}.sv ul{list-style:none;padding:0;display:grid;gap:5px}.sv li:before{content:"✓  ";font-weight:800}
.strips{display:flex;gap:10px;height:118px}
.strip{width:62px;background:#fff;padding:5px;border-radius:6px;display:grid;gap:4px;box-shadow:0 6px 16px #0003;align-self:flex-start}
.strip i{aspect-ratio:1;border-radius:3px;display:grid;place-items:center;font-size:16px;font-style:normal}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.ph{aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;font-size:32px}
.steps{display:flex;gap:12px;margin:22px 0 16px;overflow-x:auto}.steps span{display:flex;gap:7px;align-items:center;color:var(--mut);white-space:nowrap;font-weight:500}.steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pri2);color:var(--pri)}.steps .on{color:var(--ink);font-weight:700}.steps .on b{background:var(--pri);color:#fff}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.opt{display:flex;gap:10px;align-items:center;padding:13px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}.opt.on{border-color:var(--pri);background:var(--pri2)}
.err{color:#d6336c;font-size:13px;margin-top:8px}.price{font-size:24px;font-weight:800;font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
.map{position:relative;min-height:290px;border-radius:20px;background:repeating-linear-gradient(45deg,var(--pri2),var(--pri2) 14px,var(--bg) 14px,var(--bg) 28px);border:1px solid var(--line)}
.pin{position:absolute;font-size:28px;background:none;border:0;cursor:pointer;transform:translate(-50%,-100%)}
.qr{width:150px;height:150px;border:10px solid #fff;background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/20px 20px;border-radius:8px;margin:0 auto}
.sm{font-size:13px}hr{border:0;border-top:1px solid var(--line);margin:12px 0}
footer{margin-top:44px;background:var(--card);border-top:1px solid var(--line);padding:24px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;z-index:20}
@media(max-width:700px){.g2,.split{grid-template-columns:1fr}.nav nav{order:3;flex-basis:100%;justify-content:flex-start}}
</style></head><body>
<header><div class="w nav"><a class="logo" href="#/">📸 Boothify</a><nav id="nv"></nav></div></header>
<main class="w" id="v"></main>
<footer><div class="w row sp"><div><div class="logo">📸 Boothify</div><p class="m sm">More locations. More moments. Prototype, tanpa transaksi nyata.</p></div><div class="row"><a class="chip" href="#/lokasi">Foto di Boothify</a><a class="chip" href="#/event">Sewa untuk Event</a></div></div></footer>
<script>
const rp=n=>'Rp '+n.toLocaleString('id-ID'),$=id=>document.getElementById(id);
const LC=[{n:'ITS Surabaya',k:'Kampus',d:'5–11 Okt',x:30,y:35},{n:'Tunjungan Plaza',k:'Mal',d:'12–18 Okt',x:55,y:55},{n:'UNAIR',k:'Kampus',d:'19–25 Okt',x:72,y:30},{n:'Galaxy Mall',k:'Mal',d:'26 Okt–1 Nov',x:40,y:78}];
const SP=[{n:'4 foto + file digital',p:25000},{n:'6 foto + file digital',p:35000},{n:'8 foto + file digital',p:45000},{n:'Paket grup (hingga 6 orang)',p:60000}];
const SL=['10.00','11.00','12.00','13.00','14.00','15.00','16.00','17.00'],FULL=['12.00','15.00'];
const EP=[{n:'Lite',p:1500000,f:['Durasi 2 jam','Foto digital semua tamu','Template dasar','Album QR']},{n:'Plus',p:2800000,f:['Durasi 3 jam','Cetak foto instan','Frame custom','Album digital bersama']},{n:'Pro',p:4800000,f:['Durasi 4 jam','Sesi tanpa batas','Branding logo acara','Dashboard analitik']}];
const ET=['Pernikahan','Ulang tahun','Acara kampus','Acara kantor','Bazar / festival'];
const PAYI={qris:'QRIS',ewallet:'E-wallet (GoPay, OVO, DANA)',bank:'Transfer bank (BCA, BNI, BRI, Mandiri)'};
const S={user:null,tab:'l',at:'f',next:null,f:'Semua',sel:0,ev:[],or:[{c:'FTO-20418',l:'UNAIR',j:'14.00',p:'6 foto',t:35000,st:'Selesai',d:'12 Sep 2026'}]};
let I,E;const rI=()=>I={loc:0,slot:'',pk:0,pay:'qris',step:1,err:'',code:''},rE=()=>E={pkg:1,step:1,nm:'',tp:'Pernikahan',tg:'',gs:'',vn:'',pic:'',em:'',wa:'',pay:'qris',err:'',code:''};rI();rE();
const strip=(h,r)=>`<div class="strip" style="transform:rotate(${r}deg)">${['😄','😎','🥰','🤪'].map((e,j)=>`<i style="background:hsl(${h+j*22} 85% 78%)">${e}</i>`).join('')}</div>`;
const ph=i=>`<div class="ph" style="background:linear-gradient(135deg,hsl(${(i*47+250)%360} 75% 82%),hsl(${(i*47+290)%360} 75% 70%))">${['🎓','🏬','🌳','📸'][i%4]}</div>`;
const steps=(a,s)=>`<div class="steps">${a.map((t,i)=>`<span class="${i<s?'on':''}"><b>${i+1}</b>${t}</span>`).join('')}</div>`;
const opts=(o,cur,fn)=>Object.keys(o).map(k=>`<div class="opt ${cur==k?'on':''}" onclick="${fn}='${k}';R()">${o[k]}</div>`).join('');
const needLogin=n=>`<div class="card" style="background:var(--pri2)"><h3>Masuk dulu</h3><p class="m">${n}</p><div class="row" style="margin-top:12px"><button class="btn" onclick="S.tab='l';S.next=location.hash;go('#/akun')">Login</button><button class="btn o" onclick="S.tab='d';S.next=location.hash;go('#/akun')">Daftar</button></div></div>`;
const V={
'':()=>`<div class="top"><h1>Foto seru,<br>di mana saja.</h1><p class="m">Satu Boothify, dua cara pakai. Pilih yang pas untukmu.</p></div>
<div class="g2"><div class="sv a"><div class="strips">${strip(330,-8)}${strip(20,5)}${strip(280,-3)}</div><h2>Foto di Boothify</h2><p>Untuk kamu dan teman-teman. Datang, foto, dan hasilnya langsung tersimpan.</p><ul><li>Pilih lokasi dan jam sesi</li><li>Bayar online, foto di booth</li><li>Foto masuk ke akun dan album</li></ul><div class="row sp"><b>Mulai Rp25.000</b><a class="btn wh" href="#/lokasi">Mulai Foto</a></div></div>
<div class="sv b"><div class="strips">${strip(250,6)}${strip(190,-6)}${strip(300,3)}</div><h2>Sewa Boothify untuk Event</h2><p>Untuk pernikahan, acara kampus, dan event perusahaan. Kami datang dan mengurus semuanya.</p><ul><li>Pilih paket sesuai acara</li><li>Isi detail acara dan booking</li><li>Bayar DP online</li></ul><div class="row sp"><b>Mulai Rp1.500.000</b><a class="btn wh" href="#/event">Sewa untuk Event</a></div></div></div>
<h2>Boothify minggu ini</h2><div class="g">${LC.map((l,i)=>`<div class="card">${ph(i)}<h3 style="margin-top:10px">${l.n}</h3><p class="m sm">${l.k} · ${l.d} Okt 2026</p><button class="btn o" style="margin-top:10px" onclick="I.loc=${i};I.step=2;go('#/foto')">Foto di sini</button></div>`).join('')}</div>`,
lokasi:()=>{const L=LC.map((l,i)=>[l,i]).filter(a=>S.f=='Semua'||a[0].k==S.f),s=LC[S.sel];return`<h1 style="font-size:38px;margin-top:26px">Lokasi Boothify</h1><p class="m">Pilih lokasi terdekat, lalu pesan sesi fotomu.</p><div class="row" style="margin:14px 0">${['Semua','Kampus','Mal'].map(c=>`<button class="chip ${S.f==c?'on':''}" onclick="S.f='${c}';R()">${c}</button>`).join('')}</div><div class="split"><div style="display:grid;gap:10px">${L.map(a=>`<div class="card row"><div style="width:80px">${ph(a[1])}</div><div style="flex:1"><b>${a[0].n}</b><div class="m sm">${a[0].k} · ${a[0].d} Okt 2026</div></div><button class="btn" onclick="I.loc=${a[1]};I.step=2;go('#/foto')">Foto di sini</button></div>`).join('')}</div><div><div class="map">${LC.map((l,i)=>`<button class="pin" style="left:${l.x}%;top:${l.y}%" aria-label="${l.n}" onclick="S.sel=${i};R()">${i==S.sel?'📍':'📌'}</button>`).join('')}</div><div class="card" style="margin-top:10px"><b>${s.n}</b><div class="m sm">Buka 10.00–20.00 WIB · ${s.d} Okt</div></div></div></div><div class="card row sp" style="margin-top:16px;background:var(--pri2)"><div><b>Mau Boothify hadir di acaramu?</b><div class="m sm">Sewa khusus untuk event pribadi, kampus, dan perusahaan.</div></div><a class="btn" href="#/event">Sewa untuk Event</a></div>`},
foto:()=>{const s=I.step,l=LC[I.loc],p=SP[I.pk];let m='';
if(s==4)return`<div class="card" style="max-width:480px;margin:36px auto;text-align:center"><h2 style="margin-top:0">Tiket sesimu siap 🎟️</h2><div class="qr" style="margin:14px auto"></div><p><b>${I.code}</b></p><p class="m" style="margin:6px 0 14px">${l.n} · ${I.slot} · ${p.n}<br>Scan QR ini di booth, foto, dan hasilnya otomatis masuk ke Galeri akunmu.</p><button class="btn b" onclick="fin()">Simulasikan selesai foto</button><a class="btn o b" style="margin-top:8px" href="#/akun">Lihat riwayat</a></div>`;
if(s==1)m=`<h3>Pilih lokasi</h3>`+LC.map((x,i)=>`<div class="opt ${I.loc==i?'on':''}" onclick="I.loc=${i};R()"><div style="flex:1"><b>${x.n}</b><div class="m sm">${x.k} · ${x.d} Okt</div></div></div>`).join('');
if(s==2)m=`<h3>Pilih jam sesi</h3><div class="row">${SL.map(t=>`<button class="chip ${I.slot==t?'on':''}" ${FULL.includes(t)?'disabled':''} onclick="I.slot='${t}';R()">${t}</button>`).join('')}</div><h3 style="margin-top:18px">Pilih paket foto</h3>`+SP.map((x,i)=>`<div class="opt ${I.pk==i?'on':''}" onclick="I.pk=${i};R()"><b style="flex:1">${x.n}</b>${rp(x.p)}</div>`).join('');
if(s==3)m=S.user?`<h3>Metode pembayaran</h3>`+opts(PAYI,I.pay,'I.pay'):needLogin('Supaya fotomu tersimpan di akun dan album, login atau daftar dulu. Pilihanmu tetap tersimpan.');
return steps(['Lokasi','Sesi','Bayar','Foto'],s)+`<div class="split"><div class="card">${m}${I.err?`<p class="err">${I.err}</p>`:''}<div class="row" style="margin-top:14px">${s>1?'<button class="btn o" onclick="I.step--;I.err=\'\';R()">Kembali</button>':''}<button class="btn pk" ${s==3&&!S.user?'disabled':''} onclick="nI()">${s==3?'Bayar sekarang':'Lanjut'}</button></div></div><div class="card"><h3>Ringkasan sesi</h3><b>${l.n}</b><div class="m sm">${l.d} Okt 2026</div><p style="margin-top:8px">${I.slot?'Jam '+I.slot:'<span class="m">Jam belum dipilih</span>'}<br>${p.n}</p><hr><div class="row sp"><b>Total</b><span class="price">${rp(p.p)}</span></div></div></div>`},
event:()=>`<div class="sv b" style="margin-top:26px"><h1 style="color:#fff;font-size:clamp(30px,5.5vw,46px)">Sewa Boothify untuk Event</h1><p style="max-width:520px">Photobooth lengkap dengan operator, cetak foto, dan album digital untuk semua tamu acaramu.</p><div><a class="btn wh" href="#event-paket" onclick="document.getElementById('ep').scrollIntoView();return false">Lihat paket</a></div></div>
<h2 id="ep">Pilih paket</h2><div class="g">${EP.map((p,i)=>`<div class="card" ${i==1?'style="border:2px solid var(--pri)"':''}>${i==1?'<span class="chip on">Paling populer</span>':''}<h3 style="margin-top:6px">${p.n}</h3><div class="price">${rp(p.p)}</div><ul style="list-style:none;padding:0;margin:12px 0;display:grid;gap:5px">${p.f.map(x=>`<li>✓ ${x}</li>`).join('')}</ul><button class="btn b ${i==1?'':'o'}" onclick="E.pkg=${i};E.step=2;go('#/event/pesan')">Pilih paket</button></div>`).join('')}</div>
<h2>Alur sewa</h2><div class="g">${[['1','Pilih paket'],['2','Isi detail acara'],['3','Booking'],['4','Bayar DP 30%']].map(a=>`<div class="card"><span class="chip on">${a[0]}</span><h3 style="margin-top:8px">${a[1]}</h3></div>`).join('')}</div>
<h2>Cocok untuk</h2><div class="row">${ET.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`,
pesan:()=>{const s=E.step,p=EP[E.pkg];let m='';
if(s==5)return`<div class="card" style="max-width:480px;margin:36px auto;text-align:center"><div style="font-size:44px">🎉</div><h2 style="margin-top:6px">Booking diterima</h2><p><b>${E.code}</b></p><p class="m" style="margin:8px 0 14px">${E.nm} · ${p.n}<br>Tim kami akan menghubungi ${E.wa} dalam 1×24 jam untuk konfirmasi.</p><button class="btn b" onclick="rE();S.at='e';go('#/akun')">Lihat di Akun</button></div>`;
if(s==1)m=`<h3>Pilih paket</h3>`+EP.map((x,i)=>`<div class="opt ${E.pkg==i?'on':''}" onclick="E.pkg=${i};R()"><div style="flex:1"><b>${x.n}</b><div class="m sm">${x.f.join(', ')}</div></div>${rp(x.p)}</div>`).join('');
if(s==2)m=`<h3>Detail acara</h3><label>Nama acara *</label><input value="${E.nm}" oninput="E.nm=this.value" placeholder="mis. Wisuda Teknik 2026"><label>Jenis acara</label><div class="row">${ET.map(x=>`<button class="chip ${E.tp==x?'on':''}" onclick="E.tp='${x}';R()">${x}</button>`).join('')}</div><label>Tanggal acara *</label><input type="date" value="${E.tg}" oninput="E.tg=this.value"><label>Perkiraan jumlah tamu *</label><input type="number" min="1" value="${E.gs}" oninput="E.gs=this.value" placeholder="mis. 150"><label>Lokasi / venue *</label><input value="${E.vn}" oninput="E.vn=this.value" placeholder="Nama gedung atau alamat">`;
if(s==3)m=`<h3>Kontak penanggung jawab</h3><label>Nama *</label><input value="${E.pic}" oninput="E.pic=this.value"><label>Email *</label><input type="email" value="${E.em}" oninput="E.em=this.value" placeholder="nama@email.com"><label>Nomor WhatsApp *</label><input value="${E.wa}" oninput="E.wa=this.value" placeholder="08xxxxxxxxxx"><p class="m sm" style="margin-top:12px">Dengan melanjutkan, kamu menyetujui jadwal akan dikonfirmasi tim Boothify.</p>`;
if(s==4)m=`<h3>Bayar DP 30%</h3><p class="m" style="margin-bottom:10px">Sisa pembayaran dilunasi H-3 sebelum acara.</p>`+opts(PAYI,E.pay,'E.pay');
return steps(['Paket','Detail acara','Booking','Pembayaran'],s)+`<div class="split"><div class="card">${m}${E.err?`<p class="err">${E.err}</p>`:''}<div class="row" style="margin-top:14px">${s>1?'<button class="btn o" onclick="E.step--;E.err=\'\';R()">Kembali</button>':''}<button class="btn" onclick="nE()">${s==4?'Bayar DP':'Lanjut'}</button></div></div><div class="card"><h3>Ringkasan booking</h3><b>Paket ${p.n}</b><div class="m sm">${p.f.join(', ')}</div><p style="margin-top:8px">${E.nm||'<span class="m">Nama acara belum diisi</span>'}<br><span class="m sm">${E.tg||'Tanggal belum dipilih'}${E.vn?' · '+E.vn:''}</span></p><hr><div class="row sp"><span>Total</span><b>${rp(p.p)}</b></div><div class="row sp"><span>DP 30%</span><span class="price">${rp(p.p*.3)}</span></div></div></div>`},
galeri:()=>{const d=S.or.filter(o=>o.st=='Selesai');return`<h1 style="font-size:38px;margin-top:26px">Galeri</h1><p class="m">Foto dari sesi Foto di Boothify tersimpan di sini.</p><div style="margin-top:16px">${!S.user?needLogin('Login untuk melihat album fotomu.'):!d.length?`<div class="card" style="text-align:center"><h3>Belum ada foto</h3><p class="m">Selesaikan sesi pertamamu, fotonya akan muncul di sini.</p><a class="btn" style="margin-top:10px" href="#/lokasi">Cari lokasi</a></div>`:`<div style="display:grid;gap:14px">${d.map((o,i)=>`<div class="card"><div class="row sp"><div><b>${o.l}</b><div class="m sm">${o.d} · ${o.p} · ${o.c}</div></div><div class="row"><button class="chip" onclick="toast('Foto diunduh (simulasi)')">Unduh</button><button class="chip" onclick="toast('Tautan disalin (simulasi)')">Bagikan</button></div></div><div class="row" style="margin-top:12px;gap:8px">${[0,1,2,3].map(j=>`<div style="flex:1;min-width:110px">${ph(i+j)}</div>`).join('')}</div></div>`).join('')}</div>`}</div>`},
akun:()=>{if(!S.user)return`<div class="card" style="max-width:420px;margin:36px auto"><h2 style="margin-top:0">${S.tab=='d'?'Buat akun':'Masuk'}</h2><div class="row"><button class="chip ${S.tab!='d'?'on':''}" onclick="S.tab='l';R()">Login</button><button class="chip ${S.tab=='d'?'on':''}" onclick="S.tab='d';R()">Daftar</button></div><p class="m sm" style="margin-top:8px">Akun menyimpan riwayat sesi dan album fotomu.</p>${S.tab=='d'?'<label>Nama lengkap</label><input id="ln" placeholder="Nama lengkap">':''}<label>Email</label><input placeholder="nama@email.com"><label>Password</label><input type="password" placeholder="Minimal 8 karakter"><button class="btn b" style="margin-top:16px" onclick="login()">${S.tab=='d'?'Daftar':'Login'}</button></div>`;
const f=S.at=='f';return`<div class="row sp" style="margin:26px 0 14px"><h1 style="font-size:36px">Halo, ${S.user.n} 👋</h1><button class="btn o" onclick="S.user=null;go('#/')">Keluar</button></div><div class="row" style="margin-bottom:14px"><button class="chip ${f?'on':''}" onclick="S.at='f';R()">Riwayat foto</button><button class="chip ${!f?'on':''}" onclick="S.at='e';R()">Sewa event</button></div><div style="display:grid;gap:10px">${f?S.or.map(o=>`<div class="card row sp"><div><b>${o.c}</b><div class="m sm">${o.l} · ${o.j} · ${o.p}</div></div><div class="row"><b>${rp(o.t)}</b><span class="chip ${o.st=='Selesai'?'':'on'}">${o.st}</span></div></div>`).join(''):S.ev.length?S.ev.map(o=>`<div class="card row sp"><div><b>${o.c}</b><div class="m sm">${o.n} · Paket ${o.p}</div></div><div class="row"><b>DP ${rp(o.t)}</b><span class="chip on">Menunggu konfirmasi</span></div></div>`).join(''):'<div class="card"><p class="m">Belum ada booking event.</p><a class="btn" style="margin-top:10px" href="#/event">Sewa untuk Event</a></div>'}</div>`}};
function go(h){location.hash=h}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function login(){S.user={n:($('ln')||{}).value||'Sarah'};const n=S.next||'#/akun';S.next=null;location.hash==n?R():go(n)}
function nI(){I.err='';if(I.step==2&&!I.slot){I.err='Pilih jam sesi dulu.';return R()}
if(I.step==3){I.code='FTO-'+Math.floor(10000+Math.random()*89999);S.or.unshift({c:I.code,l:LC[I.loc].n,j:I.slot,p:SP[I.pk].n,t:SP[I.pk].p,st:'Menunggu sesi',d:'3 Okt 2026'})}I.step++;R()}
function fin(){S.or.find(o=>o.c==I.code).st='Selesai';rI();toast('Sesi selesai, foto masuk ke Galeri');go('#/galeri')}
function nE(){E.err='';if(E.step==2&&(!E.nm.trim()||!E.tg||!(+E.gs>0)||!E.vn.trim())){E.err='Lengkapi nama acara, tanggal, jumlah tamu, dan venue.';return R()}
if(E.step==3&&(!E.pic.trim()||!/\S+@\S+/.test(E.em)||E.wa.replace(/\D/g,'').length<9)){E.err='Lengkapi nama, email yang valid, dan nomor WhatsApp.';return R()}
if(E.step==4){E.code='BKG-'+Math.floor(10000+Math.random()*89999);if(!S.user)S.user={n:E.pic.split(' ')[0]};S.ev.unshift({c:E.code,n:E.nm,p:EP[E.pkg].n,t:EP[E.pkg].p*.3})}E.step++;R()}
function render(){const p=location.hash.replace('#/','').split('/'),k=p[0],f=k=='event'&&p[1]=='pesan'?V.pesan:(k!='pesan'&&V[k])||V[''];$('v').innerHTML=f();const a=k=='foto'?'lokasi':k;
$('nv').innerHTML=[['','Beranda'],['lokasi','Lokasi'],['event','Sewa untuk Event'],['galeri','Galeri'],['akun','Akun']].map(x=>`<a class="${x[0]==a?'on':''}" href="#/${x[0]}">${x[1]}</a>`).join('')}
function R(){const y=scrollY;render();scrollTo(0,y)}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
